<h1>Atividade 1 - Imagens no S3</h1>
<p><b>{{ msg }}</b></p>
<h2>Enviar imagem</h2>
<form action="/upload" method="post" enctype="multipart/form-data">
  <input name="arquivo" type="file" accept="image/*" required>
  <button>Enviar</button>
</form>
<h2>Imagens no bucket</h2>
<table border="1" cellpadding="5">
  <tr><th>Imagem</th><th>Nome</th><th>Tamanho</th><th></th></tr>
  {% for a in arquivos %}
  <tr>
    <td><img src="/arquivo/{{ a.Key }}" height="60"></td>
    <td>{{ a.Key }}</td>
    <td>{{ (a.Size / 1024) | round(1) }} KB</td>
    <td><a href="/arquivo/{{ a.Key }}?download">Download</a></td>
  </tr>
  {% else %}
  <tr><td colspan="4">Nenhuma imagem enviada ainda</td></tr>
  {% endfor %}
</table>
