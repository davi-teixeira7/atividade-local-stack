<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atividade LocalStack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex flex-column align-items-center justify-content-center gap-4">

  <div class="d-flex gap-4 text-center small text-secondary">
    <div><img src="https://cdn.jsdelivr.net/npm/simple-icons@13.0.0/icons/amazons3.svg" width="36" alt=""><br>S3</div>
    <div><img src="https://cdn.jsdelivr.net/npm/simple-icons@13.0.0/icons/amazondynamodb.svg" width="36" alt=""><br>DynamoDB</div>
    <div><img src="https://cdn.jsdelivr.net/npm/simple-icons@13.0.0/icons/awslambda.svg" width="36" alt=""><br>Lambda</div>
  </div>

  <div class="card p-4 w-100" style="max-width: 340px">
  {% if pagina == "cadastro" %}
    <h1 class="h5 text-center mb-3">Criar conta</h1>
    <form action="/cadastro" method="post">
      <input class="form-control mb-2" name="nome" placeholder="Nome" required>
      <input class="form-control mb-2" name="email" placeholder="Email" required>
      <input class="form-control mb-3" name="senha" type="password" placeholder="Senha" required>
      <button class="btn btn-primary w-100">Cadastrar</button>
    </form>
    <p class="text-center small mt-3 mb-0">Já tem conta? <a href="/login">Entrar</a></p>

  {% elif pagina == "logado" %}
    <div class="alert alert-success text-center mb-3">Login realizado com sucesso, {{ nome }}!</div>
    <a class="btn btn-outline-secondary w-100" href="/login">Sair</a>

  {% else %}
    <h1 class="h5 text-center mb-3">Entrar</h1>
    {% if msg %}<div class="alert alert-success py-2 small">{{ msg }}</div>{% endif %}
    {% if erro %}<div class="alert alert-danger py-2 small">{{ erro }}</div>{% endif %}
    <form action="/login" method="post">
      <input class="form-control mb-2" name="email" placeholder="Email" required>
      <input class="form-control mb-3" name="senha" type="password" placeholder="Senha" required>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
    <p class="text-center small mt-3 mb-0">Não tem conta? <a href="/cadastro">Criar conta</a></p>
  {% endif %}
  </div>

</div>
</body>
</html>
